# JitPack builds this fork's release tags, e.g. 1.7.0-mariuszs.1. The SDK needs JDK 21;
# JitPack defaults to Java 8. The release profile (gpg signing, Central publishing) stays
# off: JitPack serves what `install` leaves in the local repository.
jdk:
  - openjdk21
# The image's Maven, not ./mvnw: since 2026-10-07 the wrapper on JitPack fails, unless
# traced, with "Could not find or load main class
# org.codehaus.plexus.classworlds.launcher.Launcher" (1.7.0-mariuszs.4 and .5).
install:
  - mvn -B install -DskipTests
