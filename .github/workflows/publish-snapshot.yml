name: Publish Snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    uses: markpollack/build-tools/.github/workflows/publish-snapshot.yml@35297f1ade5f47c2925d6dab42a7e2d43bd734d0
    with:
      java-version: '21'
      # Snapshot verification runs the tests. Publishing an artifact that no build
      # proved green is what the release policy forbids.
      skip-tests: false
      # The Claude CLI is installed for CLIFlagParityIT, which only reads
      # `claude --help` — no account, no API call. The paid "live" IT classes are
      # excluded by default via failsafe.excluded.groups in the parent POM, so this
      # workflow no longer needs a provider credential merely to publish a snapshot.
      agent-clis: 'claude'
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      # ANTHROPIC_API_KEY deliberately not passed: a development snapshot must not
      # cost paid provider calls. Live verification is live-integration.yml.
