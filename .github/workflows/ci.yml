name: CI Build

# Trigger note: this uses `pull_request`, NOT `pull_request_target`.
#
# `pull_request` runs fork PRs in a context with no access to repository secrets,
# which is what we want: a fork must never be able to reach a provider credential.
# `pull_request_target` would run the PR against the base repo's secret context and
# is a well-known exfiltration path for exactly that. Do not "fix" a fork PR that
# cannot see a secret by switching this trigger.
#
# As of the live-integration split this workflow needs no provider credential at all,
# so there is nothing here for a fork to reach in the first place.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Pinned to an immutable build-tools commit so the reusable workflow cannot change
    # under this repository. Note the actions *inside* build-tools still float on tags
    # and @main; that is tracked as a shared Build Tools item, not fixable from here.
    uses: markpollack/build-tools/.github/workflows/ci-build.yml@35297f1ade5f47c2925d6dab42a7e2d43bd734d0
    with:
      java-version: '21'
      # The Claude CLI is still installed, but only so CLIFlagParityIT can read
      # `claude --help`. That is a local, offline, unauthenticated call: it needs the
      # binary, not an account. It is what keeps criticalSdkFlagsShouldBeInCli - the
      # assertion that the flags this SDK actually emits still exist - a hard gate on
      # every build.
      agent-clis: 'claude'
    # No secrets are passed. `verify` excludes the "live" JUnit tag by default (see
    # failsafe.excluded.groups in the parent POM), so the paid Claude integration
    # tests do not run here. They run in live-integration.yml on demand.

  standalone-consumer-gate:
    # The published consumer shape is not covered by the reactor build: the parent's
    # dependencyManagement does not survive POM flattening, which is exactly how 1.4.0
    # shipped vulnerable Jackson floors while its own build stayed green.
    #
    # Deterministic by construction — no Trivy, no NVD/OWASP database, no credentials,
    # no Claude CLI, no paid model calls — so it runs on every build.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Standalone consumer gate
        run: ./scripts/standalone-consumer-gate.sh
