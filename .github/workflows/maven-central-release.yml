name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.5.0)'
        required: true
        type: string

jobs:
  release:
    # The one canonical release workflow for this repository.
    uses: markpollack/build-tools/.github/workflows/maven-central-release.yml@35297f1ade5f47c2925d6dab42a7e2d43bd734d0
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      java-version: '21'
      # Release verification runs the tests. A release is the last place to skip them.
      skip-tests: false
      # The Claude CLI is installed so CLIFlagParityIT can read `claude --help` and
      # keep criticalSdkFlagsShouldBeInCli a hard gate on the release candidate. The
      # paid "live" IT classes are excluded by default (failsafe.excluded.groups),
      # so release verification itself is credential-free and deterministic.
      #
      # Live evidence for a candidate comes from live-integration.yml, run against the
      # exact candidate SHA. RELEASING.md states when a fresh live run is required and
      # when existing exact-SHA evidence may be reused.
      agent-clis: 'claude'
      # Curated, tracked notes rather than a generated commit list.
      release-notes-file: release-notes/${{ inputs.version }}.md
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      # ANTHROPIC_API_KEY deliberately not passed: the release job does not re-run the
      # live suite. See RELEASING.md.
